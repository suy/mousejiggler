# Windows release pipeline: build with qmake + MSVC, deploy the Qt runtime
# with windeployqt, package an Inno Setup installer plus a portable archive,
# and attach both to a GitHub release when a v* tag is pushed.
#
# Publishing steps that come later (kept out on purpose until the installer
# has been tested for a while and the repository is public): a winget-pkgs
# manifest, and code signing via the SignPath Foundation.

name: Windows

on:
  push:
    branches: [prototype, master]
    tags: ['v*']
  workflow_dispatch:

env:
  # Qt 6.8 LTS. 6.8.3 is the newest 6.8.x with public prebuilt binaries:
  # from 6.8.4 on, the 6.8 LTS patches are commercial-only (verified
  # against download.qt.io's online repository).
  QT_VERSION: 6.8.3
  QT_ARCH: win64_msvc2022_64

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ env.QT_ARCH }}

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Read version from mousejiggler.pro
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path mousejiggler.pro -Pattern '^VERSION\s*=\s*(\S+)'
          "version=$($line.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Build (qmake + nmake)
        shell: pwsh
        # `qmake` on Windows defaults to debug_and_release, which builds the
        # release tree in `release`. That directory is what the packaging steps
        # below expect (exe + deployed runtime, nothing else). `nmake release`
        # builds only that tree. Plain `nmake` would also build the debug tree.
        run: |
          mkdir build
          cd build
          qmake ..\mousejiggler.pro
          nmake release

      - name: Build and run tests
        shell: pwsh
        # Runs before windeployqt on purpose: the test spawns the real
        # application, which resolves the Qt runtime from PATH (installed by
        # install-qt-action), so no deployed DLLs are needed and a failure never
        # reaches the packaging steps.
        run: |
          mkdir build\tests
          cd build\tests
          qmake ..\..\tests\auto\test_single_instance.pro
          nmake check

      - name: Deploy Qt runtime (windeployqt)
        shell: pwsh
        # Call `windeployqt` skipping what we don't use.
        # * By skipping `generic` we skip TUIO touch support, which drags Qt
        #   Network as a dependency.
        # * Image formats/engines are unnecessary as we only need PNG (which is
        #   compiled into Qt Gui, without plugin), and those extra plugins are
        #   SVG, GIF, ICO and JPEG.
        # * We don't use anything from RHI, directly or indirectly, so skip
        #   software OpenGL, D3D shader compiler, and the DXC shader compiler
        #   (dxcompiler.dll and dxil.dll).
        # * The compiler runtime DLLs are copied explicitly in the next step;
        #   the default behavior would also drop vc_redist.x64.exe here.
        run: >
          windeployqt
          --release
          --no-translations
          --no-opengl-sw
          --no-system-d3d-compiler
          --no-system-dxc-compiler
          --no-compiler-runtime
          --skip-plugin-types generic,imageformats,iconengines
          build\release\mousejiggler.exe

      - name: Copy MSVC runtime libraries
        shell: pwsh
        # windeployqt --compiler-runtime is unreliable on CI. Copy the
        # redistributable DLLs explicitly. VCToolsRedistDir is exported by
        # msvc-dev-cmd and points into `VC\Redist\MSVC\<version>` of the toolset
        # (no hardcoded VS path: VS 2022 is a 64-bit install under Program
        # Files, and image layouts change).
        run: |
          Copy-Item "$env:VCToolsRedistDir\x64\Microsoft.VC143.CRT\*.dll" build\release\

      - name: List deployed files
        shell: pwsh
        run: Get-ChildItem -Recurse build\release | Select-Object -ExpandProperty FullName

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: ISCC /DMyAppVersion=${{ steps.version.outputs.version }} src\mousejiggler.iss

      - name: Package portable archive
        shell: pwsh
        # build\release doubles as qmake's compilation tree, so it holds build
        # by-products (object files, generated moc_/qrc_ sources, loose .qm)
        # next to the deployed runtime. Stage just the runtime files and
        # compress that, instead of zipping build\release\* wholesale.
        run: |
          New-Item -ItemType Directory -Force build\portable | Out-Null
          $staging = "build\portable\staging"
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item build\release\mousejiggler.exe, build\release\*.dll $staging
          Copy-Item LICENSE $staging
          Copy-Item build\release\platforms, build\release\styles $staging -Recurse
          Compress-Archive -Path $staging\* -DestinationPath "build\portable\MouseJiggler-${{ steps.version.outputs.version }}-x64-portable.zip"
          Remove-Item -Recurse -Force $staging

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            build/dist/*.exe
            build/portable/*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: artifact
      - name: Attach artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifact/**
          fail_on_unmatched_files: true
