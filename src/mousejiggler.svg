<svg
  xmlns="http://www.w3.org/2000/svg"
  width="256"
  height="256"
  viewBox="0 0 256 256"
  fill="none"
>

  <!-- Mouse body -->
  <path
    d="M128 30
       C86 30 58 59 58 101
       V153
       C58 196 86 226 128 226
       C170 226 198 196 198 153
       V101
       C198 59 170 30 128 30Z"
    fill="#1F2937"
    stroke="#FFFFFF"
    stroke-width="10"
    stroke-linejoin="round"
  />

  <!-- Mouse center seam -->
  <path
    d="M128 35V89"
    stroke="#FFFFFF"
    stroke-width="9"
    stroke-linecap="round"
  />

  <!-- Scroll wheel -->
  <rect
    x="113"
    y="65"
    width="30"
    height="46"
    rx="15"
    fill="#FFFFFF"
  />

  <path
    d="M128 76V96"
    stroke="#1F2937"
    stroke-width="7"
    stroke-linecap="round"
  />

  <!--
    Jiggle accents:
    Three arc segments per shoulder, mirrored.
    Common center: (128,100) - the body corner radius center,
    so the arcs follow the mouse's own curvature.
    Angular span: -62 to -14 degrees, radii: 84, 95, 106.
  -->
  <!-- Right arcs -->
  <path d="M167.44 25.83 A84 84 0 0 1 209.50 79.68"
    stroke="#38BDF8"
    stroke-width="5"
    stroke-linecap="round"
  />
  <path d="M172.60 16.12 A95 95 0 0 1 220.18 77.02"
    stroke="#38BDF8"
    stroke-width="5"
    stroke-linecap="round"
  />
  <path d="M177.76 6.41 A106 106 0 0 1 230.85 74.36"
    stroke="#38BDF8"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- Left arcs -->
  <path d="M88.56 25.83 A84 84 0 0 0 46.50 79.68"
    stroke="#38BDF8"
    stroke-width="5"
    stroke-linecap="round"
  />
  <path d="M83.40 16.12 A95 95 0 0 0 35.82 77.02"
    stroke="#38BDF8"
    stroke-width="5"
    stroke-linecap="round"
  />
  <path d="M78.24 6.41 A106 106 0 0 0 25.15 74.36"
    stroke="#38BDF8"
    stroke-width="5"
    stroke-linecap="round"
  />

</svg>
